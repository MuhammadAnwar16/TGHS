  <circle cx="700" cy="460" r="45" fill="#FAF6EE" stroke="#3D352B" stroke-width="2"/>
  <text x="700" y="465" font-family="serif" font-size="11" font-weight="bold" fill="#1F1B16" text-anchor="middle">GANDHARA</text>
  <text x="700" y="478" font-family="serif" font-size="9" fill="#B5573B" text-anchor="middle">ROUNDABOUT</text>

