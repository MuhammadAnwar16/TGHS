<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9C3A0" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
    <linearGradient id="parkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E6E4B"/>
      <stop offset="100%" stop-color="#344D32"/>
    </linearGradient>
    <linearGradient id="commercialGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7674B"/>
      <stop offset="100%" stop-color="#9C442A"/>
    </linearGradient>
    <linearGradient id="residentialGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFE4D2"/>
      <stop offset="100%" stop-color="#DEC9AE"/>
    </linearGradient>
  </defs>

  <!-- Blueprint Background Canvas -->
  <rect width="1400" height="900" fill="#FAF6EE"/>
  <rect width="1400" height="900" fill="url(#grid)"/>

  <!-- Scheme Perimeter Boundary Border -->
  <rect x="80" y="80" width="1240" height="740" rx="12" fill="none" stroke="#1F1B16" stroke-width="4" stroke-dasharray="16 8"/>

  <!-- Main 100ft Grand Entrance Avenue (Running West to East across bottom) -->
  <rect x="80" y="700" width="1240" height="80" fill="#3D352B"/>
  <line x1="80" y1="740" x2="1320" y2="740" stroke="#B8892D" stroke-width="3" stroke-dasharray="24 16"/>
  <text x="700" y="747" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FAF6EE" text-anchor="middle" letter-spacing="4">MAIN ENTRANCE BOULEVARD (100 FT DUAL CARRIAGEWAY)</text>

  <!-- North-South 80ft Boulevard -->
  <rect x="660" y="80" width="80" height="620" fill="#3D352B"/>
  <line x1="700" y1="80" x2="700" y2="700" stroke="#B8892D" stroke-width="3" stroke-dasharray="24 16"/>

  <!-- Central Stupa Roundabout (Intersection) -->
