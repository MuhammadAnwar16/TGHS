    <text x="192" y="375" font-family="monospace" font-size="11" fill="#1F1B16" text-anchor="middle">A-05 (10M)</text>

    <rect x="260" y="340" width="105" height="60" rx="3" fill="#FFFBF5" stroke="#B8892D" stroke-width="1.5"/>
    <text x="312" y="375" font-family="monospace" font-size="11" fill="#1F1B16" text-anchor="middle">A-06 (10M)</text>

