    <!-- Plot Row 1 (1 Kanal) -->
    <rect x="140" y="170" width="105" height="110" rx="3" fill="#FFFBF5" stroke="#B8892D" stroke-width="1.5"/>
    <text x="192" y="220" font-family="monospace" font-size="13" font-weight="bold" fill="#1F1B16" text-anchor="middle">A-01</text>
    <text x="192" y="240" font-family="sans-serif" font-size="10" fill="#3F5A3C" text-anchor="middle">1 Kanal (Avail)</text>

    <rect x="260" y="170" width="105" height="110" rx="3" fill="#E8DEC8" stroke="#8F785C" stroke-width="1.5"/>
    <text x="312" y="220" font-family="monospace" font-size="13" font-weight="bold" fill="#1F1B16" text-anchor="middle">A-02</text>
    <text x="312" y="240" font-family="sans-serif" font-size="10" fill="#B5573B" text-anchor="middle">1 Kanal (Booked)</text>

