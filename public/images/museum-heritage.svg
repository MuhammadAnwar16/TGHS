<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="museumBg" x1="600" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D251D"/>
      <stop offset="60%" stop-color="#3D3227"/>
      <stop offset="100%" stop-color="#1A1612"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="600" cy="400" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9C3A0" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#B8892D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1F1B16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Gallery Wall Background -->
  <rect width="1200" height="800" fill="url(#museumBg)"/>
  <rect width="1200" height="800" fill="url(#spotlight)"/>

  <!-- Museum Archway Frame -->
  <path d="M150 750V350C150 150 400 80 600 80C800 80 1050 150 1050 350V750" stroke="#B8892D" stroke-width="6" opacity="0.4"/>
  <path d="M180 750V360C180 180 410 110 600 110C790 110 1020 180 1020 360V750" stroke="#D9C3A0" stroke-width="2" opacity="0.25"/>

  <!-- Dharmarajika Stupa Central Archaeological Carving (Carved Schist Stone Relief) -->
  <g transform="translate(350, 180)">
    <!-- Base Plinth -->
    <rect x="50" y="440" width="400" height="40" rx="3" fill="#B89E78" stroke="#1F1B16" stroke-width="3"/>
    <rect x="75" y="400" width="350" height="40" fill="#D9C3A0" stroke="#1F1B16" stroke-width="2"/>
    <rect x="100" y="360" width="300" height="40" fill="#C5AC85" stroke="#1F1B16" stroke-width="2"/>

    <!-- Drum Terraces with decorative niches -->
    <path d="M125 360C125 220 180 160 250 160C320 160 375 220 375 360Z" fill="#D9C3A0" stroke="#1F1B16" stroke-width="3"/>

    <!-- Niches with Gandhara arch relief -->
    <path d="M210 320V260C210 245 225 235 250 235C275 235 290 245 290 260V320H210Z" fill="#917757"/>

    <!-- Meditative Figure Silhouette -->
    <ellipse cx="250" cy="275" rx="10" ry="12" fill="#241E18"/>
    <path d="M236 312C236 295 242 290 250 290C258 290 264 295 264 312H236Z" fill="#241E18"/>

    <!-- Harmika Square Balcony -->
    <rect x="220" y="130" width="60" height="30" fill="#B8892D" stroke="#1F1B16" stroke-width="2"/>

    <!-- Multi-tiered Chhatravalis (Triple Royal Umbrellas) -->
    <line x1="250" y1="40" x2="250" y2="130" stroke="#FAF6EE" stroke-width="4"/>
    <path d="M210 115C230 105 270 105 290 115" stroke="#B8892D" stroke-width="5" stroke-linecap="round"/>
    <path d="M220 90C235 80 265 80 280 90" stroke="#B8892D" stroke-width="5" stroke-linecap="round"/>
    <path d="M230 65C240 58 260 58 270 65" stroke="#B8892D" stroke-width="5" stroke-linecap="round"/>
    <circle cx="250" cy="40" r="5" fill="#FAF6EE"/>
  </g>

  <!-- Museum Exhibition Pedestal & Placard -->
  <rect x="300" y="670" width="600" height="70" rx="4" fill="#1F1B16" stroke="#B8892D" stroke-width="2"/>
  <text x="600" y="705" font-family="serif" font-size="20" font-weight="bold" fill="#F7F1E5" text-anchor="middle" letter-spacing="3">TAXILA MUSEUM • DHARMARAJIKA RELIC EXHIBIT</text>
  <text x="600" y="726" font-family="monospace" font-size="12" fill="#B8892D" text-anchor="middle" letter-spacing="1">GANDHARA CIVILIZATION (3RD CENTURY BCE) • UNESCO WORLD HERITAGE ARCHIVE</text>
</svg>
